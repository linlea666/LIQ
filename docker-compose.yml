services:
  backend:
    build:
      context: ./backend
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: liq-backend
    # 2026-08 OOM 事故复盘：on-failure:5 达上限后容器永久停机 8 小时无人拉起。
    # 行情服务可用性优先——unless-stopped + mem_limit 已足够保护宿主机
    # （OOM kill 发生在容器内，Docker 重启自带指数退避，不会拖垮整机）。
    restart: unless-stopped
    ports:
      - "8800:8000"
    env_file:
      - ./backend/.env
    volumes:
      # 持久化所有运行时写入的数据，防止 docker-compose up --build 后丢失
      # /app/data        → 滚仓持仓、api 缓存、ai/kl 历史、新闻账本、信号 PnL 等
      # /app/logs        → te_shadow / te_eval / 诊断日志
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    mem_limit: 2g
    # 与 mem_limit 相同即禁止该容器使用 swap：宁可快速失败，也不要 swap thrashing 拖死整机。
    memswap_limit: 2g
    healthcheck:
      # /api/ready 只在核心行情暖机完成后返回 200；暖机期不得被判定为可用。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # 潜力币雷达：完全独立的进程与数据库，与主后端无任何共享状态。
  # 刻意不声明 depends_on backend —— 两者的可用性必须彼此独立，
  # 主后端重启不应该顺带打断雷达正在追踪的代币生命周期。
  radar:
    build:
      context: ./radar
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: liq-radar
    restart: on-failure:5
    # 停机时数据库最多排空 20 秒 + checkpoint。Docker 默认只给 10 秒宽限期，
    # 到点直接 SIGKILL——每次重启都会静默丢掉队列里的警报与 Outcome，
    # 而且不留任何日志。这里给足余量
    stop_grace_period: 40s
    ports:
      - "8802:8000"
    env_file:
      - ./radar/.env
    volumes:
      # /app/data → SQLite 数据库、原始归档
      # /app/logs → JSONL 运维日志
      - ./radar/data:/app/data
      - ./radar/logs:/app/logs
    # 512MB 是经过内存核算的：注册表默认上限 4000 个代币视图，
    # 加上写队列与 aiohttp 连接池，稳态约 150-250MB，留一倍余量。
    # 与主后端的 2g 相加仍在 3.5GB 整机预算内
    mem_limit: 512m
    memswap_limit: 512m
    # 采集是 IO 密集而非计算密集，半核足够；限制它是为了保证
    # 主后端的行情计算在同一台机器上不会被采集高峰抢走 CPU
    cpus: 0.5
    healthcheck:
      # /ready 在采集降级时返回 503：一个所有接口都在超时的雷达
      # 在进程层面完全健康，但它已经不再是雷达了
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/radar/ready', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://8.217.240.76:8800
        NEXT_PUBLIC_WS_URL: http://8.217.240.76:8800
        NEXT_PUBLIC_RADAR_API_BASE: http://8.217.240.76:8802
    container_name: liq-frontend
    restart: always
    ports:
      - "8801:3000"
    mem_limit: 384m
    depends_on:
      backend:
        condition: service_healthy
