# 潜力币雷达 V1 配置
#
# 重要：本文件中所有阈值均为「待回测初始值」，不是已验证的最优参数。
# 修改本文件会改变 config_hash，所有后续警报都会记录新的指纹，便于策略版本对比。
# 修改后需重启容器生效（进程内单例）。

service:
  host: "0.0.0.0"
  port: 8000
  # 相对本文件所在目录；容器内通过 bind volume 挂载到 /app/data
  data_dir: "data"
  # 展示用时区偏移（邮件与前端时间戳）
  tz_offset_hours: 8
  # 前端跨源访问白名单（8801 前端 → 8802 radar）
  cors_origins:
    - "http://8.217.240.76:8801"
    - "http://localhost:3000"
    - "http://localhost:8801"

chains:
  - id: "56"
    name: "BSC"
    enabled: true
  - id: "CT_501"
    name: "Solana"
    enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# 请求调度：全局硬上限 + 每层独立上限（双重约束）
# 90 rpm 是我方保守假设，不是币安承诺值；429 超阈值会自动降速。
# ─────────────────────────────────────────────────────────────────────────────
scheduler:
  global_rpm: 90
  # 常态目标；预留额度留给突发、分页与重试
  target_rpm: 72
  jitter_ratio: 0.15
  # 单请求超时与重试
  request_timeout_sec: 12
  max_retries: 2
  retry_backoff_base_sec: 2.0

  adaptive:
    # 滚动窗口内 429 占比超过阈值 → 全局配额乘以 downscale_ratio
    window_sec: 300
    rate_limit_threshold: 0.05
    downscale_ratio: 0.8
    min_rpm: 30
    # 连续无 429 达到该时长后逐步恢复
    recover_after_sec: 600

  # 每层的独立 rpm 上限与目标轮询间隔
  # discovery 为 P0，永不被降频；watching/reject 主要靠列表被动更新
  tiers:
    discovery: { max_rpm: 18, interval_sec: 60 }
    social:    { max_rpm: 2,  interval_sec: 300 }
    audit:     { max_rpm: 3,  interval_sec: 0 }
    burst:     { max_rpm: 20, interval_sec: 25 }
    s2:        { max_rpm: 25, interval_sec: 30 }
    s1:        { max_rpm: 20, interval_sec: 90 }
    s0:        { max_rpm: 10, interval_sec: 150 }
    watching:  { max_rpm: 4,  interval_sec: 900 }
    reject:    { max_rpm: 3,  interval_sec: 2400 }

  # 警报触发后该币临时进入最高频采样，服务延迟入场收益与纸面成交。
  # V2 延长到覆盖 S2 确认期（min_age_from_s1_sec=1200 + 余量）：
  # 确认期内的回撤/结构判断依赖高频观测
  burst_window_sec: 1800
  # 冷启动/重启时列表涌入的存量币入库限速，避免瞬时打爆预算与写队列
  onboarding_max_per_min: 90

# 内存中的代币注册表
registry:
  # 常驻内存的代币上限。超出后按"价值最低优先"淘汰（DEAD/DORMANT → 低分 WATCHING），
  # 被淘汰的只是内存视图，数据库里的历史完整保留，再次出现在榜单时会自动复活。
  max_tokens_in_memory: 4000
  evict_batch: 200
  # 重启后从数据库恢复的活跃代币数量与时间窗
  restore_limit: 1500
  restore_max_age_hours: 48

# 数据采集
collectors:
  # 单次列表请求返回条数
  list_page_size: 50
  # meme rush 三阶段：10=New 20=Finalizing 30=Migrated
  meme_rush_stages: [10, 20, 30]
  # 热门榜时间窗：30=1h（10=1m 20=5m 40=4h 50=24h）
  trending_period: 30
  # 聪明钱流入榜窗口
  inflow_period: "1h"
  # 社交热度榜语言
  social_language: "zh-CN"
  # 详情接口返回的 1 分钟价格序列：提取区间极值后丢弃原始序列
  extract_chart_extremes: true

# ─────────────────────────────────────────────────────────────────────────────
# 数据质量：系统必须知道"自己什么时候不知道"
#   某个字段组过期不能只让日志变黄，必须真实压低 DataQuality 与 Confidence，
#   严重时直接阻止晋升——否则会在数据已不可信的情况下继续发 S2 警报。
# ─────────────────────────────────────────────────────────────────────────────
quality:
  # 各字段组的新鲜/过期阈值（秒）。fresh 内不罚分，超过后按超时程度线性罚分
  freshness:
    market:       { fresh_sec: 300,   stale_sec: 900 }
    holders:      { fresh_sec: 300,   stale_sec: 1200 }
    distribution: { fresh_sec: 600,   stale_sec: 2400 }
    smart_money:  { fresh_sec: 900,   stale_sec: 3600 }
    social:       { fresh_sec: 3600,  stale_sec: 14400 }
    audit:        { fresh_sec: 86400, stale_sec: 259200 }
    supply:       { fresh_sec: 86400, stale_sec: 604800 }
  # 字段组完全缺失时的扣分（社交覆盖率天然很低，故罚分极轻）
  missing_penalty:
    market: 35
    holders: 15
    distribution: 20
    smart_money: 10
    social: 3
    audit: 8
    supply: 6
  # 过期状态下的最大扣分（按超时程度在 0 到该值之间线性插值）
  stale_penalty:
    market: 25
    holders: 12
    distribution: 15
    smart_money: 10
    social: 2
    audit: 5
    supply: 4
  # 市值交叉校验：reported 与 price×circulating_supply 的偏离超过阈值即视为冲突
  mc_deviation_warn: 0.15
  mc_deviation_conflict: 0.35
  mc_conflict_penalty: 15
  # 低于这两个分数时禁止晋升到对应状态（硬闸门，不可被高 Opportunity 覆盖）
  min_for_s1: 55
  min_for_s2: 70

# ─────────────────────────────────────────────────────────────────────────────
# 双层风险门
#   execution_blocker：硬拒，永不产生交易型警报
#   research_gate：降级但继续低频追踪（防错杀未来赢家，进拒绝样本池）
# ─────────────────────────────────────────────────────────────────────────────
risk:
  execution_blocker:
    audit_risk_level_min: 4        # 币安审计 riskLevel >= 4 视为高危
    sell_tax_max_pct: 10.0
    buy_tax_max_pct: 10.0
    honeypot_blocks: true

  research_gate:
    # Top10 阈值按代币年龄动态放宽：极早期筹码天然集中
    top10_max_pct_by_age:
      - { max_age_min: 30,   threshold: 65.0 }
      - { max_age_min: 180,  threshold: 55.0 }
      - { max_age_min: 1440, threshold: 50.0 }
      - { max_age_min: null, threshold: 45.0 }
    # 组合集中度：dev + sniper + insider + bundler 合计
    combined_concentration_max_pct: 55.0
    dev_max_pct: 15.0
    min_liquidity_usd: 5000.0
    min_liquidity_mc_ratio: 0.01
    # 这里引用的是 radar/domain/tags.py 中的内部标签名，不是币安原始文案。
    # 币安改展示文案时只需改解析层映射表，风险规则无需变动。
    wash_trading_tags:
      - "DEV_WASH_TRADING"
      - "INSIDER_WASH_TRADING"

  # 审计请求节流：只对有意义的币消耗配额
  audit:
    min_liquidity_usd: 3000.0
    recheck_before_s1: true
    ttl_sec: 86400

# ─────────────────────────────────────────────────────────────────────────────
# 特征工程：所有比率类特征强制分母下限 + winsorize，防小基数爆炸
# ─────────────────────────────────────────────────────────────────────────────
features:
  # 比率分母下限（美元）：市值低于此值时按此值计算，避免 2 万市值把比率推到无穷
  min_market_cap_denominator: 30000.0
  min_liquidity_denominator: 3000.0
  # 持有人基数下限：holders 1→3 不应被当作 +200% 强信号
  min_holder_denominator: 30
  # 变化率截断上限（倍数），超出按上限计
  winsorize_growth_cap: 5.0
  # 计算速度/加速度所需的历史窗口
  lookback_windows_sec: [300, 900, 3600]
  # 快照最小写入间隔（秒）：同一代币高频更新时限流，控制写放大。
  # 这是 S1 及以上的基准值——它们的密集历史是复盘的原料，值得每分钟一帧。
  snapshot_min_interval_sec: 55
  # 低状态代币的间隔单独放宽。理由与调度器分层 rpm 相同：
  # 稀缺资源要按价值分配。单行快照约 4KB（features_json 占一半），
  # 若 4000 枚币不分状态一律每分钟一帧，磁盘增长约 23GB/天——
  # 而抽稀要 48 小时后才启动，磁盘会先被填满，连带拖垮同机的主后端。
  # 状态变更与 Near-Miss 不受此限（决策现场永远即时落盘）。
  snapshot_min_interval_by_state:
    DISCOVERED: 1800
    WATCHING: 900
    DORMANT: 3600
    DEAD: 3600
    BLOCKED: 3600
    S0: 240

# ─────────────────────────────────────────────────────────────────────────────
# 五维评分权重（Opportunity 满分 100）
# ─────────────────────────────────────────────────────────────────────────────
scoring:
  # v2.0.0：S1 观察池 + S2 确认制 + RugRisk 行为项。
  # KPI 按版本分组，新旧警报自动分开统计
  strategy_version: "v2.0.0"
  feature_version: "f1.0.0"
  opportunity_weights:
    holder_momentum: 20
    capital_flow: 20
    smart_money: 15
    liquidity_quality: 15
    distribution_health: 15
    social_momentum: 10
    valuation_upside: 5
  # 估值情景：用于止盈参考，明示为情景假设而非价格预测
  valuation_scenarios:
    base_mc: 3000000
    strong_mc: 10000000
    viral_mc: 30000000
    mania_mc: 100000000

# ─────────────────────────────────────────────────────────────────────────────
# 状态机：进入阈值 != 退出阈值（滞回），且有最短驻留时间，防抖动
# ─────────────────────────────────────────────────────────────────────────────
state_machine:
  min_dwell_sec: 180
  # 退出需连续 N 个评分周期低于退出阈值
  exit_confirm_cycles: 2
  transitions:
    s0:
      enter_opportunity: 55
      exit_opportunity: 45
      max_rug_risk: 70
      min_data_quality: 40
    s1:
      enter_opportunity: 72
      exit_opportunity: 62
      max_rug_risk: 45
      min_data_quality: 60
      min_liquidity_usd: 12000.0
      min_confidence: 50
    # 【V2 起弃用】S2 不再由机会分晋升（85 分在当前评分模型下数学上
    # 不可达，实测 24,621 条快照最大 75.26），改走下方 s2_confirmation
    # 确认制。键位保留仅为配置向后兼容；S2 的维持/退出闸门继承 s1 规则
    s2:
      enter_opportunity: 85
      exit_opportunity: 75
      max_rug_risk: 35
      min_data_quality: 70
      min_confidence: 65
      min_smart_money_count: 3
  # S2 确认制（V2）：S1 是观察池，S2 是确认级推送。
  # 晋升不看机会分，看四个可证伪的问题：活得够久吗？扛住回撤了吗？
  # 结构还在改善吗？有二次确认吗？外加行为硬否决（即时转派发观察）
  s2_confirmation:
    enabled: true
    # 进入 S1 后至少存活该时长才可确认（榜单币第一波拉升通常几分钟内结束，
    # 能活过 20 分钟且不破位的才谈得上"确认"）
    min_age_from_s1_sec: 1200
    # 确认期最高价回撤超过该百分比视为破位，不予确认
    max_drawdown_from_peak_pct: 40.0
    # 现价不得低于 S1 锚点价的该比例
    min_price_vs_anchor_ratio: 0.7
    # 硬否决：LP 较锚点抽离超过该百分比 → 即时转 DISTRIBUTION
    hard_veto_lp_drop_pct: 20.0
    # 硬否决：聪明钱离场率达到该值 → 即时转 DISTRIBUTION
    hard_veto_exit_rate: 60.0
  distribution:
    enter_score: 60
    exit_score: 45
  # 沉寂进 DORMANT（可复活）；DEAD 仅限硬性死亡
  dormant_after_stale_sec: 21600
  dead_min_liquidity_usd: 500.0
  # 价格较近期高点（内存历史窗口，约 2 小时）崩塌该百分比视为死亡。
  # 拔池后接口常报残余流动性，只靠流动性线抓不到最常见的死法
  dead_price_collapse_pct: 90.0
  # 崩塌需连续 N 次评估确认才判死，防单次坏数据误杀（DEAD 本身可复活）
  dead_confirm_cycles: 2

# 警报与邮件
alerts:
  # 差 near_miss_margin 分以内未触发的，落库不发信，供未来阈值反事实研究
  near_miss_margin: 5.0
  # 同一 币×规则 的 near-miss 冷却，防阈值附近震荡刷爆事件表
  near_miss_cooldown_sec: 600
  cooldown_sec:
    s1: 3600
    s2: 1800
    distribution: 3600
  # 派发邮件门槛：警报照常落库，但只有"此前发过 S1/S2 通知（用户可能持有）
  # 且当前市值/流动性仍达标（还来得及操作）"的币才发邮件。
  # 无门槛的实盘结果：4/4 的派发邮件都发给了已崩盘成尘埃的币
  distribution_gate:
    min_market_cap_usd: 100000.0
    min_liquidity_usd: 10000.0
  # 策略异常检测：信号速率偏离历史基线数量级时告警
  anomaly:
    # 冷启动期（累计运行时长不足）只记录不告警，避免无基线误报
    warmup_hours: 48
    baseline_window_hours: 168
    deviation_multiple: 8.0

email:
  enabled: true
  smtp_host: "smtp.163.com"
  smtp_port: 465
  from_name: "LIQ雷达"
  to:
    - "466460082@qq.com"
  # 全局限速：防 MEME_MANIA 行情下邮件风暴；超量合并为摘要邮件
  max_per_hour: 12
  digest_on_overflow: true
  # 摘要自身的最小间隔。摘要不走 max_per_hour（它就是限速的溢出通道），
  # 因此必须自己节流，否则狂热行情下摘要会把每小时上限彻底架空
  digest_interval_sec: 900
  # V2：S1 重定位为观察池，默认不发邮件（进入 S1 只落库 + 开启高频采样）；
  # 用户收到的第一封邮件是 S2 确认级推送。要恢复 V1 行为把它改回 true
  send_s1: false
  send_s2: true
  send_distribution: true
  daily_kpi_hour_local: 9
  outbox_max_retries: 5
  outbox_retry_backoff_sec: 120

# 生命周期追踪
tracker:
  # 市值里程碑（美元）；仅记录首次上穿，带滞回避免反复穿越
  milestones_usd: [30000, 50000, 100000, 300000, 1000000, 3000000, 10000000, 30000000, 100000000]
  milestone_hysteresis_pct: 3.0
  # 多窗口 Outcome（小时）
  outcome_horizons_hours: [1, 4, 12, 24, 72, 168, 720]
  # 延迟入场收益采样点（秒）
  entry_delay_sec: [15, 30, 60, 120]
  # Sustained ATH 判定：价格需维持 min_hold_sec 且区间成交额达标
  sustained_min_hold_sec: 300
  sustained_min_volume_usd: 2000.0
  # 纸面仓位规模（美元）
  paper_position_sizes: [100, 500, 1000]
  # 流动性调整倍数估计：仓位占流动性比例的滑点惩罚系数（粗略上界，非真实报价）
  liquidity_slippage_factor: 2.0

# ─────────────────────────────────────────────────────────────────────────────
# 存储：分级留存 + 独立水位线 + 每日在线备份
# ─────────────────────────────────────────────────────────────────────────────
storage:
  # 单写入协程队列容量；满时丢弃低优先级写入并计入事件
  write_queue_size: 5000
  write_batch_size: 200
  write_flush_interval_sec: 2.0
  busy_timeout_ms: 8000
  # 独立水位线（GB）
  max_db_gb: 5.0
  max_raw_archive_gb: 3.0
  max_logs_gb: 1.0
  # 降采样：超过 downsample_after_hours 的快照按间隔抽稀
  downsample_after_hours: 48
  downsample_interval_sec: 300
  downsample_2_after_hours: 168
  downsample_2_interval_sec: 3600
  # 原始响应留存：列表响应统一短留存，详情响应对重要币长期保留
  raw_list_retention_hours: 72
  raw_detail_retention_days: 400
  cleanup_interval_sec: 3600
  backup_hour_local: 4
  backup_keep: 14
  # 被拒代币的分层采样比例（用于反事实研究）
  reject_sample_ratio: 0.08

observability:
  log_level: "INFO"
  # 运维日志文件轮转
  log_file_max_mb: 64
  log_file_backup_count: 10
  # 同类错误聚合窗口：窗口内相同错误只发一条 API_DEGRADED，恢复时补充统计
  error_aggregate_window_sec: 300
  # 特征分布漂移监测
  drift:
    check_interval_sec: 900
    min_samples: 50
    # 某特征 NULL 率或固定值占比超过阈值 → DATA_DRIFT
    max_null_ratio: 0.6
    max_constant_ratio: 0.9
