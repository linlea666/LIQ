coins:
  BTC:
    ccy: "BTC"
    symbol_cg: "BTC"
    symbol_cg_pair: "BTCUSDT"
    exchange_primary: "Binance"
    ct_val: 0.01
    default: true
  ETH:
    ccy: "ETH"
    symbol_cg: "ETH"
    symbol_cg_pair: "ETHUSDT"
    exchange_primary: "Binance"
    ct_val: 0.1
  SOL:
    ccy: "SOL"
    symbol_cg: "SOL"
    symbol_cg_pair: "SOLUSDT"
    exchange_primary: "Binance"
    ct_val: 1

sources:
  coinglass:
    base_url: "https://www.keystore.com.cn/api/v1/proxy/coinglass"
    api_key_env: "COINGLASS_API_KEY"
    api_key_default: "ks_live_eab38da3fef4c429848d11b1fda6bf2b"
    timeout_sec: 15
    rate_limit_per_min: 30
    daily_limit: 50000
    poll_intervals:
      ticker: 15
      oi: 60
      indicators: 600
      funding_rate: 60
      liquidation_map: 60
      liquidation_heatmap: 600
      orderbook: 60
      large_orders: 120
      long_short: 120
      taker_volume: 120
      cvd: 60
      options: 600
      etf: 1800
      onchain: 3600
      macro_index: 600
      whale: 600
      news: 1800

processors:
  cvd:
    source: "coinglass"
    period: "5m"
  percentile:
    lookback_hours: 168
  market_temp:
    weights:
      liq_imbalance: 0.08
      cvd_trend: 0.14
      oi_change: 0.10
      funding_rate: 0.10
      basis: 0.07
      taker_flow: 0.13
      liquidation_ratio: 0.08
      ls_ratio: 0.08
      fear_greed: 0.07
      etf_flow: 0.08
      global_liq: 0.07
  levels:
    min_liq_cluster_usd: 10000000
    atr_multiplier_sl: 1.5
    volume_profile_bins: 50
    min_sniper_rr: 2.5
    ladder_max_tiers: 5
    ladder_min_rr: 3.0
    ladder_max_distance_pct: 20
    ladder_min_distance_pct: 5
    ladder_total_risk_pct: 10
    ladder_sl_min_pct: 2.0
  range_signal:
    near_boundary_pct: 1.5
    wick_body_ratio: 0.30
    wick_min_atr_mult: 1.2
    candles_daily_poll_sec: 300
    candles_weekly_poll_sec: 900
  key_level_tracker:
    approach_pct: 2.0
    test_pct: 0.5
    bounce_pct: 1.0
    break_confirm_sec: 300
    break_depth_pct: 0.3
    flip_zone_pct: 0.5
    max_tracked_levels: 8
    level_expire_sec: 86400
    sweep_proximity_pct: 2.0
    cascade_weight_cap_m: 20
    cascade_norm: 50
  orderbook:
    whale_threshold_btc: 10
    whale_threshold_eth: 100
    whale_threshold_sol: 1000
    whale_threshold_usd: 500000
    spoofing_ttl_sec: 3

engine:
  inactive_poll_sec: 120
  grace_period_sec: 60

ai:
  active: "deepseek"
  timeout_sec: 120
  max_retries: 2
  cooldown_sec: 30
  max_history: 5
  providers:
    openai:
      model: "gpt-4o"
      api_base: "https://api.openai.com/v1"
      env_key: "OPENAI_API_KEY"
    deepseek:
      model: "deepseek-chat"
      api_base: "https://api.deepseek.com"
      env_key: "DEEPSEEK_API_KEY"

push:
  ticker_interval_ms: 1000
  factor_cards_interval_ms: 5000
  liq_map_interval_ms: 30000
  cvd_oi_interval_ms: 10000
  orderbook_interval_ms: 2000

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://8.217.240.76:8801"
    - "http://8.217.240.76"
