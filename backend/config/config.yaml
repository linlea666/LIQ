coins:
  BTC:
    ccy: "BTC"
    symbol_cg: "BTC"
    symbol_cg_pair: "BTCUSDT"
    exchange_primary: "Binance"
    ct_val: 0.01
    default: true
  ETH:
    ccy: "ETH"
    symbol_cg: "ETH"
    symbol_cg_pair: "ETHUSDT"
    exchange_primary: "Binance"
    ct_val: 0.1
  SOL:
    ccy: "SOL"
    symbol_cg: "SOL"
    symbol_cg_pair: "SOLUSDT"
    exchange_primary: "Binance"
    ct_val: 1

sources:
  coinglass:
    base_url: "https://www.keystore.com.cn/api/v1/proxy/coinglass"
    api_key_env: "COINGLASS_API_KEY"
    api_key_default: "ks_live_eab38da3fef4c429848d11b1fda6bf2b"
    timeout_sec: 15
    rate_limit_per_min: 10
    daily_limit: 50000
    # ── 缓存策略全局基线（见 sources/coinglass.py:_MIN_CACHE_TTL）──
    # 所有非 _FAST_PATHS 端点强制 cache_ttl ≥ 300s。下面 poll_interval 应当
    # ≥ 对应端点缓存 TTL，避免 task wakeup 频繁但实际仅命中缓存。
    # 清算相关端点合计约 2 req/min（占 10/min 限额的 20%），健康。
    poll_intervals:
      ticker: 15
      oi: 60
      indicators: 600
      funding_rate: 120         # 资金费率变化慢，60→120s（释放配额给 orderbook_pressure）
      liquidation_map: 90       # 1d 清算地图变化温和，60→90s（释放配额）
      liquidation_heatmap: 600       # 24h 热力图（与 24h 时间窗匹配）
      liquidation_heatmap_7d: 1800   # 7d 热力图（数据冷，30 分钟一次足够）
      liquidation_max_pain: 300      # 全币种共享一次拉取，与缓存 TTL=300s 对齐
      orderbook: 60
      large_orders: 120         # snapshot active + history ended 双轨合并（poll_large_orders 内部）
      long_short: 120
      taker_volume: 120
      cvd: 90                   # CVD 序列足够稳定，60→90s（释放配额）
      footprint: 180            # MAA · 合约+现货足迹图（1h 粒度，180s 轮询）
      orderbook_pressure: 90    # 挂单压力监测器：/orderbook/history 深度热力图（前后帧对比）
      options: 600
      etf: 1800
      onchain: 3600
      macro_index: 600
      whale: 600
      news: 1800
  bbx:
    url: "https://bbx.com/api/pc?module=v1/market/index"
    cache_ttl: 120            # 两次实际请求间最小间隔（秒）
    timeout_sec: 15
    poll_interval: 120        # engine 轮询间隔（秒）
  binance:
    base_url: "https://fapi.binance.com"
    timeout_sec: 10
    use_for_ticker: true
    use_for_klines: true
    use_for_basis: true
    ws_enabled: true
    ws_url: "wss://fstream.binance.com/ws/!ticker@arr"
    ws_reconnect_min_sec: 2
    ws_reconnect_max_sec: 30

processors:
  cvd:
    source: "coinglass"
    period: "5m"
  percentile:
    lookback_hours: 168
  market_temp:
    weights:
      liq_imbalance: 0.08
      cvd_trend: 0.14
      oi_change: 0.10
      funding_rate: 0.10
      basis: 0.07
      taker_flow: 0.13
      liquidation_ratio: 0.08
      ls_ratio: 0.08
      fear_greed: 0.07
      etf_flow: 0.08
      global_liq: 0.07
  levels:
    min_liq_cluster_usd: 10000000
    atr_multiplier_sl: 1.5
    volume_profile_bins: 50
    min_sniper_rr: 2.5
    ladder_max_tiers: 5
    ladder_min_rr: 3.0
    ladder_max_distance_pct: 20
    ladder_min_distance_pct: 5
    ladder_total_risk_pct: 10
    ladder_sl_min_pct: 2.0
  range_signal:
    near_boundary_pct: 1.5
    wick_body_ratio: 0.30
    wick_min_atr_mult: 1.2
    candles_daily_poll_sec: 300
    candles_weekly_poll_sec: 900
  key_level_tracker:
    approach_pct: 2.0
    test_pct: 0.5
    bounce_pct: 1.0
    break_confirm_sec: 300
    break_depth_pct: 0.3
    flip_zone_pct: 0.5
    max_tracked_levels: 12
    level_expire_sec: 86400
    sweep_proximity_pct: 2.0
    cascade_weight_cap_m: 20
    cascade_norm: 600
    snapshot_interval_sec: 7200
  orderbook:
    whale_threshold_btc: 10
    whale_threshold_eth: 100
    whale_threshold_sol: 1000
    whale_threshold_usd: 500000
    spoofing_ttl_sec: 3

  # 挂单压力监测器（盘口订单流仪表盘，辅助参考工具）
  # 数据源分层：
  #   - 近+中距 (≤4%): 5min 订单簿热力图（撮合面真实压力）
  #   - 远距 (4-12%) : 大单 lifecycle（精确知挂单时长，可分级时间衰减/累积）
  # 强度评分：strength = size_usd × duration_factor × (1+0.3·whale) × (1+0.2·absorption)
  # 强度等级：S ≥ $30M / A ≥ $10M / B ≥ $3M / C ≥ $500K（绝对 USD 阈值，跨币种通用）
  orderbook_pressure:
    # ── 数据源边界 ────────────────────────────────────────────────────
    depth_range_pct: 4.0          # depth 路径只看 ±4%（近+中距）
    large_orders_min_pct: 4.0     # large_orders 路径起点 4%
    large_orders_max_pct: 12.0    # large_orders 路径终点 12%（与关键位远距对齐）
    # ── depth 路径阈值 ───────────────────────────────────────────────
    wall_size_top_pct: 0.20       # 价格带内 top 20% USD 视为 wall
    wall_min_usd: 500000          # 单 wall 最低 USD 阈值（C 级门槛）
    merge_tol_pct: 0.0005         # 同价位合并 ±0.05%
    # ── large_orders 路径阈值 ────────────────────────────────────────
    large_orders_merge_tol_pct: 0.0010  # 大单聚合 ±0.10%
    large_match_tol_pct: 0.0010   # depth 路径补 has_active_whale 标记的容差
    # ── 输出限制 ──────────────────────────────────────────────────────
    max_walls_per_side: 8         # 每侧最多输出 8 个堆
    # ── L2 共振 ───────────────────────────────────────────────────────
    absorption_atr_mult: 0.5      # absorption_zone 共振容差 ±0.5×ATR
    min_atr_pct_fallback: 0.005   # 无 ATR 时退化为 0.5% 价距
    # ── 强度阈值（USD 绝对值）─────────────────────────────────────────
    tier_s_min_usd: 30000000      # S ≥ $30M
    tier_a_min_usd: 10000000      # A ≥ $10M
    tier_b_min_usd: 3000000       # B ≥ $3M（其余 ≥ $500K 为 C）

engine:
  inactive_poll_sec: 120
  grace_period_sec: 60

ai:
  active: "deepseek"
  # 全链路统一 deepseek-v4-flash 非思考模式（thinking=disabled）：
  #   - reasoning_tokens 恒为 0 → 单次响应 P95 ~5-20s，timeout 120s 留足 6-12× 裕度
  #   - deepseek-chat / deepseek-reasoner 2026-07-24 下线，预先对齐 V4
  #   - 所有 AI 客户端在 api_kwargs 里显式传 extra_body={"thinking":{"type":"disabled"}}
  timeout_sec: 120
  max_retries: 2
  cooldown_sec: 30
  max_history: 500
  auto_interval_sec: 7200
  providers:
    openai:
      model: "gpt-4o"
      api_base: "https://api.openai.com/v1"
      env_key: "OPENAI_API_KEY"
    deepseek:
      model: "deepseek-v4-flash"
      api_base: "https://api.deepseek.com"
      env_key: "DEEPSEEK_API_KEY"

  # D12 · 新闻智能 Agent（共享 DEEPSEEK_API_KEY，与主 AI 同模型不同限流）
  # 负责 Layer 2 AI 结构化 + Layer 3c 滚动简报
  # 与主 AI 并行运行，互不阻塞
  news_agent:
    model: "deepseek-v4-flash"
    timeout_sec: 60
    max_retries: 2
    temperature: 0.2
    max_tokens_structurer: 2500  # Layer 2 结构化单批预算
    max_tokens_brief: 1800       # Layer 3c 简报预算
    batch_size_blackswan: 1      # 黑天鹅单条单发
    batch_size_major: 3
    batch_size_normal: 5
    # api_base / env_key 默认沿用 providers.deepseek，可通过下面两项显式覆盖
    api_base: ""   # 空=复用 providers.deepseek.api_base
    env_key: ""    # 空=复用 providers.deepseek.env_key
    # ── P1.2b · 编排循环节律 ──
    fetch_interval_sec: 600          # 新闻源拉取 + 滤波 + 结构化（10 分钟一跳）
    brief_interval_sec: 3600         # Rolling Brief 周期重写（1 小时）
    backfill_interval_sec: 900       # 价格回填扫描（15 分钟）
    decay_interval_sec: 1800         # Narrative / Geo 衰减（30 分钟）
    ledger_max_events: 500           # 滚动账本最大条目
    ledger_max_age_sec: 172800       # 滚动账本最长保留 48h
    blackswan_rewrite_brief: true    # 黑天鹅立即重写简报

push:
  ticker_interval_ms: 1000
  factor_cards_interval_ms: 5000
  liq_map_interval_ms: 30000
  cvd_oi_interval_ms: 10000
  orderbook_interval_ms: 2000

notifications:
  email:
    enabled: true
    smtp_host: "smtp.163.com"
    smtp_port: 465
    from_name: "LIQ监控"
    to:
      - "466460082@qq.com"
    min_signal_tier: "A"       # S=仅S级, A=S+A级都通知（A 级信号频次适中，与实盘节奏匹配）
    cooldown_minutes: 45
    include_range: false       # 箱体S级信号（暂时关闭 · 仅保留 MAA 通道）
    include_key_levels: false  # 关键位S级信号（暂时关闭 · 仅保留 MAA 通道）
    digest_hour_utc: 0         # 日报发送时间（UTC），0=北京8点
    digest_enabled: true       # 启用日报/周报
    # ── MAA（Market Action Analyzer）邮件通道 ──
    # 触发：accepted_scenario 切换 + bias∈{long,short} + conf≥min + 非 range_bound + dq=ok
    # 强信号：confidence≥strong + continuity.stance=reversal → 独立 dedup_key + 短 cooldown + 紫橙色卡片
    include_market_action: true
    market_action_min_confidence: 75       # 普通通道 confidence 门槛
    market_action_strong_confidence: 85    # 强信号通道阈值（同时要求 reversal）
    market_action_strong_cooldown_minutes: 20  # 强信号独立冷却（普通通道沿用 cooldown_minutes）
    market_action_coins:                   # 仅这些币种发 MAA 邮件（不发 SOL）
      - "BTC"
      - "ETH"

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://8.217.240.76:8801"
    - "http://8.217.240.76"

# ── NOFX 外部 AI 决策接口（/api/nofx/*） ──
# 目的：为 NOFX 项目（3 分钟一次决策）提供"完整原始行情快照"，仅返回原始/统计
#       类数据，已剔除本项目所有加工层（trend_exhaustion / market_structure /
#       direction_vote / temperature / execution_plan / ai_trader_report …）
# 关键约束：
#   1. JSON 返回，字段命名稳定，向后兼容（仅允许加字段）
#   2. 纯读内存，不触发外部请求，对现有系统零侵入
#   3. 30s 响应缓存 + IP 令牌桶限频，防呆并保护 CPU
# ── Market Action Analyzer (MAA) · AI Arbiter 节 ──
# 独立于主 AI（后者输出长文 markdown 交易计划），MAA 只做"基于真实市场动作的
# 场景结构识别"，复用 ai 段的 DeepSeek 配置（model / api_key / timeout / retries）。
# 输出固定 6 块 JSON + PromptDebug（供前端展示"本轮喂给 AI 的完整数据"）。
market_action:
  enabled: true
  auto_interval_sec: 600      # 10 分钟一次；v4-flash 非思考单次 ~5-20s，3 币交错无压力
  max_history: 200            # per-coin 历史保留条数（~33h @ 10min）
  include_prompt_in_api: true # /api/market-action/report 默认返回 prompt_debug

nofx:
  enabled: true
  cache_ttl_sec: 30           # 响应字节级缓存（远小于 NOFX 3min 节奏，业务透明）
  rate_limit_per_min: 60      # 单 IP 上限；NOFX 3min/次 = 20/h，远低于此
  allow_coins: ["BTC", "ETH", "SOL"]
  candle_limit:               # 每个时间框返回最近 N 根（按 state 实际可用容量）
    "15m": 96                 # 最近 24h
    "1h":  168                # 最近 7d
    "4h":  120                # 最近 20d
    "1d":  90                 # 最近 3 个月
    "1w":  60                 # 最近 ~1.2 年
